# Workflow for building NPM/Maven projects and Docker images
name: build

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
      timezone: "Europe/Berlin"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TZ: Europe/Berlin
    strategy:
      fail-fast: false
      matrix:
        include: # Add or modify paths according to your project structure
          - app-path: backend
          - app-path: frontend
          - app-path: eai
          - app-path: webcomponent

    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@94f7e40aa557a2790abfa98a9cc9186d260b94f8 # v1.0.27
      - id: node # required for steps.* syntax
        if: ${{ hashFiles(format('./{0}/package.json', matrix.app-path)) != '' }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@297-trivy-often-failing-maven-dependency-scanning
        with:
          app-path: ${{ matrix.app-path }}
          node-version: "24"
      - id: maven # required for steps.* syntax
        if: ${{ hashFiles(format('./{0}/pom.xml', matrix.app-path)) != '' }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@297-trivy-often-failing-maven-dependency-scanning
        with:
          app-path: ${{ matrix.app-path }}
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.app-path }}
      - id: e
        run: |
          echo ${{ join(steps.*.outputs.cyclone-path) }}
          cat ${{ join(steps.*.outputs.cyclone-path) }}
      - name: Run Trivy vulnerability scanner in repository mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
         scan-type: "sbom"
         scan-ref: "${{ join(steps.*.outputs.cyclone-path) }}"
         format: "json"
         exit-code: "1"
         timeout: "15m0s"
         trivyignores: ".trivyignore"
         output: trivy-report.json
      - id: e1
        if: always()
        run: |
          cat trivy-report.json
      - id: build
        # if: ${{ github.ref == 'refs/heads/main' && (steps.node.outcome == 'success' || steps.maven.outcome == 'success') }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@297-trivy-often-failing-maven-dependency-scanning
        with:
          path: ${{ matrix.app-path }}
          image-name: ${{ matrix.app-path }}
          artifact-name: ${{ join(steps.*.outputs.artifact-name) }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: |
            type=raw,value=dev
            
