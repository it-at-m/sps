# Workflow to check health of dockercompose based development stacks
name: dockercompose-healthcheck

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
      timezone: "Europe/Berlin"

jobs:
  dockercompose-healthcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-dockercompose-healthcheck@94f7e40aa557a2790abfa98a9cc9186d260b94f8 # v1.0.27
        with:
          skip-exited: true # required for keycloakmigration init container
          compose-file-path: "./stack/"

  notify:
    runs-on: ubuntu-latest
    if: failure() # This job runs only if the previous job fails
    steps:
      - name: Notify Webex
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"markdown" : "${{ github.server_url }}/${{ github.repository }} ${{ github.workflow }} failed"}' \
            "https://webexapis.com/v1/webhooks/incoming/${{ secrets.WEBEX_TOKEN }}"
