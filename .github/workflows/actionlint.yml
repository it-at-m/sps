# Workflow for scanning GitHub workflows with actionlint
name: actionlint

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
      timezone: "Europe/Berlin"
jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-actionlint@dev
      - name: Notify Webex
        if: failure() # This job runs only if the previous job fails
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"markdown" : "${{ github.server_url }}/${{ github.repository }} ${{ github.workflow }} failed"}' \
            "https://webexapis.com/v1/webhooks/incoming/${{ secrets.WEBEX_TOKEN }}"

