# Workflow for running security scan using Trivy
name: trivy

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron:  '* * * * *'
    # cron: '30 5 * * 1'
      timezone: "Europe/Berlin"

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to the GitHub Security tab
    if: github.event_name == 'schedule' 
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-trivy@94f7e40aa557a2790abfa98a9cc9186d260b94f8 # v1.0.27



  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    if: github.event_name == 'pull_request' 
    outputs:
      # Expose matched filters as job 'packages' output variable
      packages: ${{ steps.filter.outputs.changes }}
    steps:
    # For pull requests it's not necessary to checkout the code
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          docs: docs/**
          backend: backend/**
          frontend: frontend/**
          webcomponent: webcomponent/**
          eai: eai/**
    - run: |
        echo ${{ toJSON(steps.filter.outputs.changes) }}
  # JOB to build and test each of modified packages
  build:
    needs: changes
    if:  ${{ needs.changes.outputs.packages != '[]' && needs.changes.outputs.packages != '' }} 
    strategy:
      matrix:
        # Parse JSON array containing names of all filters matching any of changed files
        # e.g. ['package1', 'package2'] if both package folders contains changes
        package: ${{ fromJSON(needs.changes.outputs.packages) [0] && fromJSON(needs.changes.outputs.packages) || fromJSON('["skip"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-trivy@feat/trivy-allow-failure
        with:
          path: ${{ matrix.package }}
